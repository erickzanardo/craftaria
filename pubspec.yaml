name: craftaria_workspace
publish_to: none

environment:
  sdk: ^3.9.0

workspace:
  - apps/game
  - packages/auth_repository
  - packages/craftaria_map
  - packages/craftaria_protocol
  - packages/craftaria_sim
  - packages/game_client
  - packages/world_renderer

dev_dependencies:
  # Provides protoc-gen-dart for `buf generate` without a global install.
  protoc_plugin: ^22.0.0
