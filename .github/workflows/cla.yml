name: cla

# pull_request_target is needed to comment on and label PRs from forks. This
# workflow never checks out or runs code from the pull request.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/erickzanardo/craftaria/blob/main/CLA.md
          # Signatures are stored on their own branch so they never need to
          # bypass protection on main.
          branch: cla-signatures
          path-to-signatures: signatures/v1/cla.json
          allowlist: erickzanardo,dependabot[bot]
