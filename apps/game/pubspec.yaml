  game_client:
    path: ../../packages/game_client
  shared_preferences: ^2.5.6
  world_renderer:
    path: ../../packages/world_renderer

dev_dependencies:
  bloc_test: ^10.0.0
  fixnum: ^1.1.1
  flame_test: ^2.3.1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
