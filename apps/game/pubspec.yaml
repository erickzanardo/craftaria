name: craftaria
description: Craftaria game client.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  auth_repository:
    path: ../../packages/auth_repository
  bloc: ^9.2.1
  craftaria_map:
    path: ../../packages/craftaria_map
  craftaria_protocol:
    path: ../../packages/craftaria_protocol
  craftaria_sim:
    path: ../../packages/craftaria_sim
  equatable: ^3.0.0
  flame: ^1.38.2
  flutter:
    sdk: flutter
