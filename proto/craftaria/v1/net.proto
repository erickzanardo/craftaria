syntax = "proto3";

package craftaria.v1;

import "craftaria/v1/map.proto";

// Coordinates on the wire are integer sub-pixels (SUBPIXELS_PER_PIXEL = 16)
// so the client prediction and the server simulation stay bit-identical.
message Vec2 {
  sint32 x = 1;
  sint32 y = 2;
}

// Every frame sent by the client.
message ClientMessage {
  oneof payload {
    Hello hello = 1;
    MoveInput move = 2;
    Ping ping = 3;
    Gather gather = 4;
    CancelAction cancel_action = 5;
    EquipItem equip = 6;
    DebugCommand debug = 7;
  }
}

// First message on a socket. The token is sent here instead of in the URL so
// it never shows up in request logs.
message Hello {
  string token = 1;
  uint32 protocol_version = 2;
}

// One simulation step of movement intent. dx and dy are -1, 0 or 1.
message MoveInput {
  uint32 seq = 1;
  sint32 dx = 2;
  sint32 dy = 3;
}

message Ping {
  uint64 client_time_ms = 1;
}

// Start gathering from the resource node on a world tile. Shares the
// MoveInput seq space so the server applies it after the moves sent before
// it.
message Gather {
  uint32 seq = 1;
  sint32 tile_x = 2;
  sint32 tile_y = 3;
}

// Stop the current action.
message CancelAction {}

// Equip the tool in an inventory slot.
message EquipItem {
  uint32 slot = 1;
}

// Development only: ignored unless the server enables debug commands.
message DebugCommand {
  oneof command {
    GrantItem grant_item = 1;
    GrantXp grant_xp = 2;
  }
}

message GrantItem {
  string item_id = 1;
  uint32 count = 2;
}

message GrantXp {
  string skill_id = 1;
  uint32 amount = 2;
}

// Every frame sent by the server.
message ServerMessage {
  oneof payload {
    Welcome welcome = 1;
    Snapshot snapshot = 2;
    ChunkData chunk = 3;
    Pong pong = 4;
    ServerError error = 5;
    InventoryUpdate inventory = 6;
    SkillUpdate skill = 7;
    ActionState action = 8;
    TileUpdate tile = 9;
    Notice notice = 10;
  }
}

message Welcome {
  string player_id = 1;
  uint32 tick_rate = 2;
  Vec2 spawn = 3;

  // Display data for every item, so the client never hardcodes content.
  repeated ItemDefinition items = 4;
}

message ItemDefinition {
  // Stable item id, e.g. "pine_log".
  string id = 1;
  string name = 2;
  uint32 max_stack = 3;
}

// The player's whole inventory, sent when it changes.
message InventoryUpdate {
  // One entry per slot; empty slots have an empty item_id.
  repeated ItemStack slots = 1;
  // Item id of the equipped tool, empty when none.
  string equipped = 2;
}

message ItemStack {
  string item_id = 1;
  uint32 count = 2;
}

// Progress in one skill, sent when it changes.
message SkillUpdate {
  // Stable skill id, e.g. "woodcutting".
  string skill_id = 1;
  uint32 level = 2;
  uint64 xp = 3;
  // Total XP at which the current level started and the next one starts.
  uint64 level_xp = 4;
  uint64 next_level_xp = 5;
}

// The player's current action. Idle when kind is empty.
message ActionState {
  // e.g. "gather".
  string kind = 1;
  sint32 tile_x = 2;
  sint32 tile_y = 3;
  // Server tick the current cycle started on, and how long it takes.
  uint32 start_tick = 4;
  uint32 duration_ticks = 5;
}

// One edited tile in a chunk the player has loaded.
message TileUpdate {
  sint32 cx = 1;
  sint32 cy = 2;
  string layer = 3;
  // Row-major tile index within the chunk.
  uint32 index = 4;
  uint32 tile_id = 5;
  bool blocked = 6;
}

enum NoticeCode {
  NOTICE_CODE_UNSPECIFIED = 0;
  NOTICE_CODE_NOTHING_TO_GATHER = 1;
  NOTICE_CODE_OUT_OF_REACH = 2;
  NOTICE_CODE_NO_TOOL = 3;
  NOTICE_CODE_TOOL_TOO_WEAK = 4;
  NOTICE_CODE_LEVEL_TOO_LOW = 5;
  NOTICE_CODE_INVENTORY_FULL = 6;
  NOTICE_CODE_DEPLETED = 7;
}

// Something the player should be told, e.g. why gathering stopped.
message Notice {
  NoticeCode code = 1;
}

// Full state of the entities around the player. Entities missing from a
// snapshot have left.
message Snapshot {
  uint32 tick = 1;

  // Last MoveInput.seq the server applied for the receiving player.
  uint32 last_input_seq = 2;

  repeated EntityState entities = 3;
}

message EntityState {
  string id = 1;
  Vec2 position = 2;
}

message ChunkData {
  Chunk chunk = 1;
}

message Pong {
  uint64 client_time_ms = 1;
  uint64 server_time_ms = 2;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_UNAUTHORIZED = 1;
  ERROR_CODE_PROTOCOL_MISMATCH = 2;
  ERROR_CODE_REPLACED = 3;
}

message ServerError {
  ErrorCode code = 1;
  string message = 2;
}
